name: CI

on:
  push:
    branches: [dev, main, staging]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/bwx
      inject-metadata: true
      test-mode: bats-docker-cli
      test-bats-files: test/bin
      smoke-enabled: true
      smoke-commands: |
        docker run --rm "${IMAGE}:latest" --version
        docker run --rm "${IMAGE}:latest" --help
    secrets: inherit
